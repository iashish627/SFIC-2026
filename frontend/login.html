<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in · CNG Network Intelligence</title>
  <link rel="stylesheet" href="css/app.css" />
  <style>
    .auth-logo { display:flex; align-items:center; gap:.75rem; margin-bottom:1.75rem; justify-content:center; }
    .auth-logo .mark { width:48px; height:48px; background:linear-gradient(135deg,#10b981,#059669); border-radius:12px; display:flex; align-items:center; justify-content:center; color:white; font-weight:700; font-size:1.1rem; box-shadow:0 6px 16px rgba(16,185,129,.35); }
  </style>
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="mark">CN</div>
      <div>
        <div style="font-weight:700;font-size:1.1rem;color:#0f172a">CNG Network Intelligence</div>
        <div style="font-size:.75rem;color:#64748b">Station-level demand & expansion planning</div>
      </div>
    </div>

    <h1 style="font-size:1.5rem;font-weight:700;margin-bottom:.25rem">Welcome back</h1>
    <p style="color:#64748b;font-size:.875rem;margin-bottom:1.5rem">Sign in to the digital twin for Gujarat CNG network planning</p>

    <form id="loginForm" style="display:flex;flex-direction:column;gap:1rem">
      <div>
        <label style="display:block;font-size:.8rem;font-weight:600;color:#334155;margin-bottom:.35rem">Work email</label>
        <input type="email" id="email" required placeholder="you@company.com" />
      </div>
      <div>
        <label style="display:block;font-size:.8rem;font-weight:600;color:#334155;margin-bottom:.35rem">Password</label>
        <input type="password" id="password" required minlength="6" placeholder="••••••••" />
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;font-size:.8rem">
        <label style="display:flex;align-items:center;gap:.4rem;color:#64748b;cursor:pointer">
          <input type="checkbox" style="width:auto" /> Remember me
        </label>
        <a href="#" style="color:#059669;font-weight:500">Forgot password?</a>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:.8rem;font-size:.9rem">
        Sign in →
      </button>
    </form>

    <p style="text-align:center;margin-top:1.25rem;font-size:.85rem;color:#64748b">
      No account? <a href="signup.html" style="color:#059669;font-weight:600">Create one</a>
    </p>
    <p style="text-align:center;margin-top:1rem;font-size:.7rem;color:#94a3b8">Demo: any email + password ≥ 6 characters</p>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', e => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const pass = document.getElementById('password').value;
      if (!email || pass.length < 6) return alert('Enter a valid email and password (min 6 chars)');
      sessionStorage.setItem('pending_email', email);
      sessionStorage.setItem('auth_flow', 'login');
      location.href = 'otp.html';
    });
  </script>
</body>
</html>

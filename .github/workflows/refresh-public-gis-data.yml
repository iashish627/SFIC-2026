name: Refresh public GIS outlet data

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/refresh-public-gis-data.yml"
      - "backend/scripts/import_public_outlets.py"
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Import public Gujarat outlet candidates
        run: python backend/scripts/import_public_outlets.py --out data/processed/stations.csv
      - name: Commit refreshed source snapshot
        run: |
          if git diff --quiet -- data/processed/stations.csv; then
            echo "No data changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed/stations.csv
          git commit -m "Refresh provisional public GIS outlet snapshot"
          git push
